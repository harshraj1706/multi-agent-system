[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cognisynth"
version = "1.0.0"
description = "Autonomous Research & Decision Intelligence Platform"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "CogniSynth Team" }]

[tool.setuptools.packages.find]
where = ["src"]
